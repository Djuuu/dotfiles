# Tmux configuration
#
# References:
# - https://tmuxcheatsheet.com/
# - https://man7.org/linux/man-pages/man1/tmux.1.html
# - https://github.com/catppuccin/tmux/blob/main/docs/reference/configuration.md

%hidden CONFIG_PATH="~/.config/tmux"
%hidden PLUGIN_PATH="~/.config/tmux/plugins"

## Options #####################################################################

source -q "${CONFIG_PATH}/tmux.keymap.conf"

# Handle system clipboard - https://github.com/tmux/tmux/wiki/Clipboard
set -g set-clipboard on
#set -as terminal-features ',xterm*:clipboard' # usually already enabled
# Enable hyperlinks
set -as terminal-features ",*:hyperlinks"
# Extended keys - https://github.com/tmux/tmux/wiki/Modifier-Keys
set -g extended-keys on
set -as terminal-features ',xterm*:extkeys'
# Enable True Color
set -as terminal-features ",xterm*:RGB"

# Leave screen content into terminal scrollback buffer when exiting
# https://superuser.com/questions/310251/use-terminal-scrollbar-with-tmux
set -ag terminal-overrides ',xterm*:smcup@:rmcup@'
# Supposed to replace '*:smcup@:rmcup@' terminal override, but doesn't seem to work quite the same
# (keeps tmux content on exit/detach but still clears content before tmux?)
# https://github.com/tmux/tmux/issues/5508
#set -s clear-on-attach off

# Allow applications to receive and process certain terminal escape sequences directly
# https://github.com/tmux/tmux/wiki/FAQ#what-is-the-passthrough-escape-sequence-and-how-do-i-use-it
%if "#{>=:#{version},3.3}"
  set -g allow-passthrough on
%endif

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g mouse on
# set -g focus-follows-mouse on

# pane status
#set -g pane-border-status top
#set -g pane-border-format '#{?pane_active,#[reverse],}#{pane_index}#[default] "#{pane_title}"#{?#{mouse},#[align=right]#[range=control|7][#{?#{pane_floating_flag},t,f}]#[norange]#[range=control|8][#{?#{window_zoomed_flag},u,z}]#[norange]#[range=control|9][x]#[norange],}' # default
set -g pane-border-format ' #[default]#{pane_title} '
%if "#{>=:#{version},3.8}"
  setw -g pane-border-status top-floating # title bar on floating panes only
%endif

# monitoring alerts
setw -g monitor-activity on
setw -g monitor-bell on
set -g visual-activity on
#set -g visual-bell on

# Disable default message "Activity in window <n>" caused by monitor-activity + visual-activity
# Silences bell and triggers window indicator display directly, without having to wait for Tmux message to disappear.
set-hook -g alert-activity {
  display-message -d 1 ""
}

%if "#{>=:#{version},3.8}"
  # Command finished hooks (needs OSC 133 marks, see bash_prompt/prompt.sh)
  set-hook -g pane-command-finished {
    # Keep last exit status per pane (failed icon in window flags)
    set -pF @last_status "#{hook_command_status}"
    set -p @last_status_fresh 1
    # Notify when a long command finishes in a background window
    if -F '#{&&:#{e|>=:#{hook_command_duration},10},#{!:#{window_active}}}' {
      display-message -d 5000 "#{?#{==:#{hook_command_status},0},#[fg=#{@thm_green}]○,#[fg=#{@thm_red}]×}#[default] #{window_index}:#{b:pane_current_path} finished after #{hook_command_duration}s"
    }
  }
  # Clear last exit status on a prompt with no command in between (empty input)
  set-hook -g pane-shell-prompt {
    if -F '#{@last_status_fresh}' { set -pu @last_status_fresh } { set -pu @last_status }
  }
%endif

# https://github.com/tmux-plugins/tmux-resurrect
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh sshs'

# https://github.com/Djuuu/tmux-git-status
set -gq @git_status_branch_max_length 40      # default: 40
set -gq @git_status_state_mode "summary"      # default: "detailed"
set -gq @git_status_show_state_counters true  # default: true
set -gq @git_status_upstream_icon_only true   # default: false
set -gq @git_status_upstream_style  "#[fg=#{@catppuccin_git_color},bold]" # default: "#[fg=cyan,bold]"
set -gq @git_status_custom_remote_1_pattern "git.tardot.dev"
set -gq @git_status_custom_remote_1_icon    "" # nf-linux-forgejo

## Catppuccin ##################################################################

source -q "${CONFIG_PATH}/tmux.catppuccin.conf"

## Status line #################################################################

source -q "${CONFIG_PATH}/tmux.status.conf"

## Local config ################################################################

source -q "${CONFIG_PATH}/tmux.conf.local"

# Plugins ######################################################################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'MunifTanjim/tmux-suspend'
set -g @plugin 'Djuuu/tmux-git-status'

## Local plugins
run "${PLUGIN_PATH}/status-cache/status-cache.tmux"
source -q "${CONFIG_PATH}/tmux.plugins.local"

# Initialize TMUX plugin manager
run "${PLUGIN_PATH}/tpm/tpm"
