
# Window menu (default)
# tmux 3.8: menus belong to their target window and are only drawn while it is visible.
# Mouse bindings resolve every target (even relative ones) from the clicked window, and -t takes no formats:
# run -C expands formats (with clicked window values) first, so -t gets the current window as a literal.
run -C "\
  display-menu -T '#[align=centre]#{window_index}:#{window_name}' \
      -t '#{session_id}:' -x M -y S -- \
      '#{?window_start_flag,-,}Swap Left'  l { if -F '#{window_active}' { swap-window -s '#{window_id}' -t ':#{e|-:#{window_index},1}' } { swap-window -d -s '#{window_id}' -t ':#{e|-:#{window_index},1}' } } \
      '#{?window_end_flag,-,}Swap Right'   r { if -F '#{window_active}' { swap-window -s '#{window_id}' -t ':#{e|+:#{window_index},1}' } { swap-window -d -s '#{window_id}' -t ':#{e|+:#{window_index},1}' } } \
      '#{?pane_marked_set,,-}Swap Marked'  s { swap-window -t '#{window_id}' } \
      '' \
      Kill                           X { kill-window -t '#{window_id}' } \
      Respawn                        R { respawn-window -k -t '#{window_id}' } \
      '#{?pane_marked,Unmark,Mark}'  m { select-pane -m -t '#{window_id}' } \
      Rename                         n { command-prompt -I '#{window_name}' { rename-window -t '#{window_id}' '%%' } } \
      'Reset name'                   z { setw -t '#{window_id}' automatic-rename } \
      '' \
      'New After'  w { new-window -a -t '#{window_id}' } \
      'New At End' W { new-window }
"
