# Tmux - status line configuration
#
# References:
# - https://man7.org/linux/man-pages/man1/tmux.1.html#STATUS_LINE
# - https://github.com/catppuccin/tmux/blob/main/docs/reference/status-line.md

# Status line margin hack
%if "#{!=:#{status},2}"
    %hidden SPC="                                                  " # 50 spaces
    set -g status 2
    set -Fg 'status-format[1]' '#{status-format[0]}'
    set -g 'status-format[0]' "#[bg=black]${SPC}${SPC}${SPC}${SPC}${SPC}${SPC}${SPC}${SPC}" # 400 spaces
%endif

set -g status-left-length 120
set -g status-right-length 100
set -g status-justify centre

## Status line - left

set -g status-left ""
set -ag status-left "#[range=user|git]#{@catppuccin_status_git}#[range=left]"

## Status line - right

set -g status-right ""
set -ag status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
if '[[ -n $("${PLUGIN_PATH}/tmux-battery/scripts/battery_percentage.sh") ]]' {
    set -agF status-right "#{E:@catppuccin_status_battery}" # Only useful on laptops
}
set -agF status-right "#[fg=#666666,bg=#{@thm_surface_0}]| #[fg=#{@thm_fg}]%H:%M "
